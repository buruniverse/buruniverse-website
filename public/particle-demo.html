<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>particle demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #F4F2F0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Courier New', monospace;
      color: #1a1917;
      gap: 1.2rem;
    }
    canvas { display: block; }
    .controls {
      display: flex;
      gap: 1rem;
      font-size: 13px;
      color: rgba(26,25,23,0.5);
    }
    button {
      background: none;
      border: 1px solid rgba(26,25,23,0.3);
      border-radius: 6px;
      padding: 0.3rem 0.9rem;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      color: #1a1917;
      transition: border-color 0.2s;
    }
    button:hover { border-color: #1a1917; }
    .fps { font-size: 11px; color: rgba(26,25,23,0.3); }
  </style>
</head>
<body>

<canvas id="c"></canvas>
<div class="controls">
  <button id="btn-scatter">scatter</button>
  <button id="btn-reform">reform</button>
  <span class="fps" id="fps">-- fps</span>
</div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

// ── canvas size ──────────────────────────────────────────
const W = Math.min(window.innerWidth * 0.95, 720);
const H = Math.round(W * 0.28);   // short & wide for single-line text
canvas.width  = W;
canvas.height = H;

// ── sample text into pixel coords (auto-fits font size) ──
function sampleText(text, gap) {
  const off = document.createElement('canvas');
  off.width  = W;
  off.height = H;
  const oc = off.getContext('2d');

  // find the largest font that fits both width and height
  let fontSize = H * 0.82;
  oc.font = `bold ${fontSize}px monospace`;
  const mw = oc.measureText(text).width;
  if (mw > W * 0.94) fontSize = fontSize * (W * 0.94) / mw;

  oc.fillStyle = '#000';
  oc.font = `bold ${fontSize}px monospace`;
  oc.textAlign    = 'center';
  oc.textBaseline = 'middle';
  oc.fillText(text, W / 2, H / 2);

  const data   = oc.getImageData(0, 0, W, H).data;
  const points = [];
  for (let y = 0; y < H; y += gap) {
    for (let x = 0; x < W; x += gap) {
      const i = (y * W + x) * 4;
      if (data[i + 3] > 128) points.push({ x, y });
    }
  }
  return points;
}

const GAP     = 4;
const targets = sampleText('∴ Buruniverse∵', GAP);

// ── characters to use as particles ───────────────────────
// ドット系 + 数学系記号
const CHARS = '·•◦∙⋅○◉⊙∘∴∵∷∶⁘⁙×÷±∓∝∞≈≡≠∈∋∧∨⊕⊗∀∃∂∇√∑∏∫'.split('');

// ── particle class ────────────────────────────────────────
class Particle {
  constructor(tx, ty) {
    this.tx = tx;  // target x
    this.ty = ty;  // target y
    this.char = CHARS[Math.floor(Math.random() * CHARS.length)];
    this.reset();
  }

  reset() {
    // start from a random position
    this.x  = Math.random() * W;
    this.y  = Math.random() * H;
    this.vx = 0;
    this.vy = 0;
    this.alpha   = 0;
    this.settled = false;
    this.mode    = 'forming'; // 'forming' | 'scatter'
  }

  scatter() {
    this.mode    = 'scatter';
    this.settled = false;
    // explode outward from current position
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 5;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
  }

  reform() {
    this.mode    = 'forming';
    this.settled = false;
    this.vx *= 0.3;
    this.vy *= 0.3;
  }

  update() {
    if (this.mode === 'forming') {
      // spring toward target
      const dx = this.tx - this.x;
      const dy = this.ty - this.y;
      const ease = 0.08 + Math.random() * 0.02;
      this.vx += dx * ease;
      this.vy += dy * ease;
      this.vx *= 0.72;
      this.vy *= 0.72;
      this.x += this.vx;
      this.y += this.vy;
      this.alpha = Math.min(1, this.alpha + 0.04);

      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 1.5 && Math.abs(this.vx) < 0.3 && Math.abs(this.vy) < 0.3) {
        this.x = this.tx;
        this.y = this.ty;
        this.settled = true;
      }
    } else {
      // scatter: drift + gravity
      this.vy += 0.12;
      this.vx *= 0.98;
      this.vy *= 0.98;
      this.x += this.vx;
      this.y += this.vy;
      this.alpha = Math.max(0, this.alpha - 0.012);
    }
  }

  draw(ctx) {
    ctx.globalAlpha = this.alpha;
    ctx.fillText(this.char, this.x, this.y);
  }
}

// ── build particles ───────────────────────────────────────
const particles = targets.map(t => new Particle(t.x, t.y));

// ── stagger the formation (each particle starts slightly later) ──
particles.forEach((p, i) => {
  p.alpha = 0;
  // begin from off-screen scattered positions, triggered with delay
  p._delay = i * 0.3 + Math.random() * 40;
  p._ready = false;
});

// ── render loop ───────────────────────────────────────────
let scattered = false;
let frameCount = 0;
let lastFPSTime = performance.now();
const fpsEl = document.getElementById('fps');

function loop() {
  requestAnimationFrame(loop);

  ctx.clearRect(0, 0, W, H);
  ctx.font      = `${GAP * 1.3}px monospace`;
  ctx.fillStyle = '#1a1917';
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';

  frameCount++;
  for (const p of particles) {
    if (!p._ready) {
      p._delay--;
      if (p._delay <= 0) p._ready = true;
      else continue;
    }
    p.update();
    p.draw(ctx);
  }
  ctx.globalAlpha = 1;

  // FPS counter
  const now = performance.now();
  if (now - lastFPSTime > 500) {
    const fps = Math.round(frameCount / ((now - lastFPSTime) / 1000));
    fpsEl.textContent = `${fps} fps`;
    frameCount   = 0;
    lastFPSTime  = now;
  }
}
loop();

// ── buttons ───────────────────────────────────────────────
document.getElementById('btn-scatter').addEventListener('click', () => {
  particles.forEach(p => { if (p._ready) p.scatter(); });
  scattered = true;
});
document.getElementById('btn-reform').addEventListener('click', () => {
  particles.forEach(p => {
    if (!p._ready) { p._ready = true; p._delay = 0; }
    p.reform();
  });
  scattered = false;
});
</script>

</body>
</html>
