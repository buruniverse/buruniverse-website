name: Auto Front Matter + EN翻訳
on:
  push:
    branches: [main]
    paths:
      - 'content/ja/posts/**'

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Front Matter を自動追加
        run: python3 .github/scripts/add_frontmatter.py

      - name: 英語に翻訳
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: |
          git -c core.quotepath=false diff --name-only HEAD -- content/ja/posts/ > changed.txt
          cat changed.txt
          if [ -s changed.txt ]; then
            xargs -d '\n' python3 .github/scripts/translate.py < changed.txt
          else
            echo "翻訳対象ファイルなし"
          fi

      - name: 変更をコミット
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: Front Matter + EN翻訳"
