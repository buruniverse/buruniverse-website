name: Auto Front Matter + EN翻訳
on:
  push:
    branches: [main]
    paths:
      - 'content/ja/blog_shelf/**'

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # 差分を取得するために履歴を少し取得

      - name: Front Matter を自動追加
        run: python3 .github/scripts/add_frontmatter.py

      - name: 変更されたファイルを特定
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: |
          # 今回のプッシュ（最新コミット）で変更されたファイルのみを抽出
          git -c core.quotepath=false diff --name-only HEAD~1 HEAD -- content/ja/blog_shelf/ | grep '\.md' > changed.txt || true
          cat changed.txt
          if [ -s changed.txt ]; then
            xargs -d '\n' python3 .github/scripts/translate.py < changed.txt
          else
            echo "翻訳対象ファイルなし"
          fi

      - name: SNS通知
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          if [ -s changed.txt ]; then
            xargs -d '\n' python3 .github/scripts/notify.py < changed.txt
          fi

      - name: 変更をコミット
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: Front Matter + EN翻訳"
