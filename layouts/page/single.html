<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
    {{ partial "head.html" . }}
    <style>
        body { background: var(--bg-color); color: var(--text-color); margin: 0; }

        #post-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 180px 30px 100px;
            position: relative;
            z-index: 20;
            line-height: 1.8;
        }

        .post-header { margin-bottom: 50px; text-align: center; }
        .post-header h1 { font-size: 1.6rem; letter-spacing: 0.1rem; margin-bottom: 10px; }

        .post-content { font-size: 1.0rem; }

        .post-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5em 0;
        }
        .post-content th,
        .post-content td {
            padding: 0.6em 1em;
            border: 1px solid rgba(128,128,128,0.3);
            text-align: left;
            vertical-align: top;
        }
        .post-content th {
            width: 40%;
            opacity: 0.6;
            font-weight: normal;
        }

        .back-link {
            display: inline-block;
            margin-top: 50px;
            text-decoration: none;
            color: inherit;
            opacity: 0.6;
            transition: opacity 0.3s;
            font-size: 1.0rem;
        }
        .back-link:hover { opacity: 1; }
    </style>
</head>
<body>
    {{ partial "header.html" . }}

    <article id="post-container">
        <header class="post-header">
            <h1>{{ .Title }}</h1>
        </header>

        <div class="post-content">
            {{ .Content }}
        </div>

        <a href="{{ "/" | relLangURL }}" class="back-link">← ホームへ</a>
    </article>

    {{ partial "scripts.html" . }}
</body>
</html>
