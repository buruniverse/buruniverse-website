<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
    {{ partial "head.html" . }}
    <style>
        /* ===== BASE ===== */
        html, body {
            margin: 0; padding: 0;
            background: var(--bg-color, #f7f7f5);
            color: var(--text-color, #222);
            overscroll-behavior: none;
        }
        body.dark-mode {
            --bg-color: #11233d;
            --text-color: #fafaf7;
        }
        canvas { display: none; } /* hide bg particles */

        /* ===== GALLERY CONTAINER ===== */
        #topo-gallery {
            position: fixed;
            top: clamp(180px, 22vw, 240px);
            left: 0;
            width: 100vw;
            height: calc(100vh - clamp(180px, 22vw, 240px));
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            z-index: 10;
            padding: 40px 8vw 100px;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 70px 60px;
        }
        #topo-gallery::-webkit-scrollbar { display: none; }

        /* ===== BLOB ITEM ===== */
        .blob-item {
            flex-shrink: 0;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            opacity: 0;
            animation: blobFadeIn 1.1s cubic-bezier(0.2, 0, 0.3, 1) forwards;
        }

        /* Organic stagger */
        .blob-item:nth-child(3n+1) { margin-top: 0; }
        .blob-item:nth-child(3n+2) { margin-top: 80px; }
        .blob-item:nth-child(3n+3) { margin-top: 25px; }

        .blob-circle {
            width: clamp(200px, 26vw, 300px);
            height: clamp(200px, 26vw, 300px);
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            transition: transform 0.45s cubic-bezier(0.2, 0, 0, 1);
        }
        .blob-item:hover .blob-circle {
            transform: scale(1.04);
        }

        .blob-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            pointer-events: none;
        }

        .blob-fog {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle, transparent 48%, var(--bg-color, #f7f7f5) 78%);
            pointer-events: none;
            z-index: 2;
            transition: background 1.2s ease;
        }
        body.dark-mode .blob-fog {
            background: radial-gradient(circle, transparent 48%, #11233d 78%);
        }

        .blob-label {
            font-family: "Noto Sans Mono", "SFMono-Regular", monospace;
            font-size: clamp(9px, 0.75vw, 11px);
            letter-spacing: 0.2em;
            color: var(--text-color);
            opacity: 0.5;
            text-align: center;
            max-width: 240px;
            transition: opacity 0.3s;
        }
        .blob-item:hover .blob-label { opacity: 0.85; }

        @keyframes blobFadeIn {
            from { opacity: 0; filter: blur(14px); }
            to   { opacity: 1; filter: blur(0); }
        }

        /* ===== POPUP — simple rounded card ===== */
        #topo-popup {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            position: fixed;
            z-index: 500;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.96);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease,
                        visibility 0s linear 0.25s;

            background: var(--bg-color, #f7f7f5);
            border-radius: 20px;
            box-shadow: 0 8px 48px rgba(0,0,0,0.18);
            overflow: hidden;
            width: min(72vw, 640px);
        }
        #topo-popup.open {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
            transition: opacity 0.25s ease, transform 0.25s ease,
                        visibility 0s linear 0s;
        }

        #popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px 10px;
        }
        #popup-title {
            font-family: "Noto Sans Mono", monospace;
            font-size: clamp(11px, 1vw, 14px);
            letter-spacing: 0.25em;
            color: var(--text-color);
            opacity: 0.8;
            margin: 0;
        }
        #popup-close {
            background: none;
            border: none;
            font-family: "Noto Sans Mono", monospace;
            font-size: 0.8rem;
            letter-spacing: 0.15em;
            color: var(--text-color);
            opacity: 0.45;
            cursor: pointer;
            padding: 2px 0;
            transition: opacity 0.2s;
        }
        #popup-close:hover { opacity: 0.9; }

        #popup-frame-wrap {
            position: relative;
            width: 100%;
            /* 1:1 aspect ratio */
            aspect-ratio: 1 / 1;
        }
        #popup-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        #popup-desc {
            padding: 12px 20px 16px;
            font-family: "Zen Kaku Gothic New", sans-serif;
            font-size: clamp(10px, 0.8vw, 12px);
            letter-spacing: 0.07em;
            line-height: 1.65;
            color: var(--text-color);
            opacity: 0.55;
            margin: 0;
        }

        /* ===== MOBILE ===== */
        @media (max-width: 767px) {
            #topo-gallery {
                top: 0;
                height: 100vh;
                padding: max(26vh, 160px) 4vw 20vh;
                gap: 30px 0;
                justify-content: space-evenly;
                align-content: flex-start;
            }
            .blob-item {
                width: 46vw;
                align-items: center;
            }
            .blob-circle {
                width: 42vw;
                height: 42vw;
                min-width: 120px;
                min-height: 120px;
            }
            .blob-item:nth-child(3n+1),
            .blob-item:nth-child(3n+2),
            .blob-item:nth-child(3n+3) { margin-top: 0; }
            .blob-item:nth-child(even) { margin-top: 32px; }
            .blob-label { font-size: clamp(8px, 2.2vw, 10px); }

            #topo-popup {
                width: 92vw;
                top: 50%;
            }
        }
    </style>
</head>
<body>
    {{ partial "scripts.html" . }}
    {{ partial "header.html" . }}

    <div id="topo-gallery">
        {{ range $i, $page := .Pages }}
        <div class="blob-item"
             style="animation-delay: {{ mul (float $i) 0.08 }}s"
             data-src="/sketches/{{ $page.Params.sketch }}/"
             data-title="{{ $page.Title }}"
             data-desc="{{ $page.Params.description }}">
            <div class="blob-circle">
                <iframe class="blob-frame"
                        src="/sketches/{{ $page.Params.sketch }}/"
                        loading="lazy"
                        scrolling="no"
                        title="{{ $page.Title }}"></iframe>
                <div class="blob-fog"></div>
            </div>
            <div class="blob-label">{{ $page.Title }}</div>
        </div>
        {{ end }}
    </div>

    <!-- Popup card -->
    <div id="topo-popup">
        <div id="popup-header">
            <h2 id="popup-title"></h2>
            <button id="popup-close">[ close ]</button>
        </div>
        <div id="popup-frame-wrap">
            <iframe id="popup-frame" src="" scrolling="no" title=""></iframe>
        </div>
        <p id="popup-desc"></p>
    </div>

    <script>
    (function() {
        var items    = document.querySelectorAll('.blob-item');
        var popup    = document.getElementById('topo-popup');
        var pFrame   = document.getElementById('popup-frame');
        var pTitle   = document.getElementById('popup-title');
        var pDesc    = document.getElementById('popup-desc');
        var closeBtn = document.getElementById('popup-close');

        function openPopup(src, title, desc) {
            pFrame.src = src;
            pTitle.textContent = title;
            pDesc.textContent  = desc;
            popup.classList.add('open');
        }
        function closePopup() {
            popup.classList.remove('open');
            setTimeout(function(){ pFrame.src = ''; }, 300);
        }

        items.forEach(function(item) {
            item.addEventListener('click', function() {
                openPopup(item.dataset.src, item.dataset.title, item.dataset.desc);
            });
        });
        closeBtn.addEventListener('click', closePopup);
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closePopup();
        });

        // Mobile: tap once to preview, tap again to open popup
        var lastTapped = null;
        items.forEach(function(item) {
            item.addEventListener('touchend', function(e) {
                if (lastTapped === item) {
                    e.preventDefault();
                    openPopup(item.dataset.src, item.dataset.title, item.dataset.desc);
                    lastTapped = null;
                } else {
                    lastTapped = item;
                    setTimeout(function() { lastTapped = null; }, 700);
                }
            }, { passive: false });
        });
    })();
    </script>
</body>
</html>
