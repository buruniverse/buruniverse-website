<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
    {{ partial "head.html" . }}
    <style>
        /* ===== BASE ===== */
        html {
            background: var(--bg-color, #f7f7f5);
            overscroll-behavior: none;
            height: 100%;
        }
        body {
            margin: 0; padding: 0; width: 100%;
            position: fixed; inset: 0; height: 100%;
            overflow: hidden;
            background: var(--bg-color, #f7f7f5);
            overscroll-behavior: none;
        }

        /* ===== GALLERY CONTAINER ===== */
        #topo-gallery {
            position: fixed;
            top: clamp(180px, 22vw, 240px);
            left: 0;
            width: 100vw;
            height: calc(100vh - clamp(180px, 22vw, 240px));
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            z-index: 10;
            padding: 30px 8vw 80px;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 10px 20px;
        }
        #topo-gallery::-webkit-scrollbar { display: none; }

        /* ===== BLOB ITEM ===== */
        .blob-item {
            flex-shrink: 0;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            opacity: 0;
            animation: blobFadeIn 1.1s cubic-bezier(0.2, 0, 0.3, 1) forwards;
        }

        /* Staggered vertical offsets for organic look */
        .blob-item:nth-child(3n+1) { margin-top: 0; }
        .blob-item:nth-child(3n+2) { margin-top: 55px; }
        .blob-item:nth-child(3n+3) { margin-top: 15px; }

        .blob-circle {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            transition: transform 0.45s cubic-bezier(0.2, 0, 0, 1);
        }
        .blob-item:hover .blob-circle {
            transform: scale(1.05);
        }

        .blob-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            pointer-events: none; /* gallery: interactive only in modal */
        }

        /* Soft vignette — fades sketch edges to page background */
        .blob-fog {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle, transparent 46%, var(--bg-color) 76%);
            pointer-events: none;
            z-index: 2;
            transition: background 1.2s ease;
        }

        .blob-label {
            font-family: "Noto Sans Mono", "SFMono-Regular", monospace;
            font-size: clamp(9px, 0.7vw, 11px);
            letter-spacing: 0.18em;
            color: var(--text-color);
            opacity: 0.55;
            text-align: center;
            max-width: 220px;
            transition: opacity 0.3s;
        }
        .blob-item:hover .blob-label { opacity: 0.9; }

        @keyframes blobFadeIn {
            from { opacity: 0; filter: blur(12px); }
            to   { opacity: 1; filter: blur(0); }
        }

        /* ===== MODAL ===== */
        #topo-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        #topo-modal.open { display: flex; }

        #modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(10, 10, 20, 0.82);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        #modal-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        #modal-close {
            position: absolute;
            top: -38px;
            right: 0;
            background: none;
            border: none;
            color: rgba(255,255,255,0.6);
            font-family: "Noto Sans Mono", monospace;
            font-size: 0.85rem;
            letter-spacing: 0.2em;
            cursor: pointer;
            padding: 4px 0;
            transition: color 0.2s;
        }
        #modal-close:hover { color: rgba(255,255,255,0.95); }

        #modal-frame-wrap {
            width: min(80vmin, 680px);
            height: min(80vmin, 680px);
            border-radius: 50%;
            overflow: hidden;
            position: relative;
        }

        #modal-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        #modal-fog {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle, transparent 55%, rgba(10,10,20,0.7) 88%);
            pointer-events: none;
        }

        #modal-info {
            text-align: center;
            color: rgba(250,250,247,0.88);
            max-width: 520px;
            padding: 0 16px;
        }
        #modal-title {
            font-family: "Noto Sans Mono", monospace;
            font-size: clamp(12px, 1.1vw, 15px);
            font-weight: 400;
            letter-spacing: 0.3em;
            margin: 0 0 10px;
        }
        #modal-desc {
            font-family: "Zen Kaku Gothic New", sans-serif;
            font-size: clamp(11px, 0.85vw, 13px);
            letter-spacing: 0.06em;
            line-height: 1.7;
            opacity: 0.68;
            margin: 0;
        }

        /* ===== MOBILE ===== */
        @media (max-width: 767px) {
            #topo-gallery {
                top: 0;
                height: 100vh;
                padding: max(26vh, 160px) 3vw 20vh;
                gap: 6px 0;
                justify-content: space-evenly;
                align-content: flex-start;
            }
            .blob-item {
                width: 46vw;
                align-items: center;
            }
            .blob-circle {
                width: 42vw;
                height: 42vw;
                min-width: 120px;
                min-height: 120px;
            }
            /* Reset stagger on mobile — just even-row offset */
            .blob-item:nth-child(3n+1),
            .blob-item:nth-child(3n+2),
            .blob-item:nth-child(3n+3) { margin-top: 0; }
            .blob-item:nth-child(even) { margin-top: 28px; }

            .blob-label { font-size: clamp(8px, 2vw, 10px); }

            #modal-frame-wrap {
                width: 86vw;
                height: 86vw;
            }
        }
    </style>
</head>
<body>
    {{ partial "scripts.html" . }}
    {{ partial "header.html" . }}

    <div id="topo-gallery">
        {{ range $i, $page := .Pages }}
        <div class="blob-item"
             style="animation-delay: {{ mul (float $i) 0.07 }}s"
             data-src="/topology/{{ $page.Params.sketch }}/"
             data-title="{{ $page.Title }}"
             data-desc="{{ $page.Params.description }}">
            <div class="blob-circle">
                <iframe class="blob-frame"
                        src="/topology/{{ $page.Params.sketch }}/"
                        loading="lazy"
                        scrolling="no"
                        title="{{ $page.Title }}"></iframe>
                <div class="blob-fog"></div>
            </div>
            <div class="blob-label">{{ $page.Title }}</div>
        </div>
        {{ end }}
    </div>

    <!-- Modal -->
    <div id="topo-modal">
        <div id="modal-backdrop"></div>
        <div id="modal-content">
            <button id="modal-close">[ close ]</button>
            <div id="modal-frame-wrap">
                <iframe id="modal-frame" src="" scrolling="no" title=""></iframe>
                <div id="modal-fog"></div>
            </div>
            <div id="modal-info">
                <h2 id="modal-title"></h2>
                <p id="modal-desc"></p>
            </div>
        </div>
    </div>

    <script>
    (function() {
        var items    = document.querySelectorAll('.blob-item');
        var modal    = document.getElementById('topo-modal');
        var mFrame   = document.getElementById('modal-frame');
        var mTitle   = document.getElementById('modal-title');
        var mDesc    = document.getElementById('modal-desc');
        var backdrop = document.getElementById('modal-backdrop');
        var closeBtn = document.getElementById('modal-close');

        function openModal(src, title, desc) {
            mFrame.src   = src;
            mTitle.textContent = title;
            mDesc.textContent  = desc;
            modal.classList.add('open');
            document.body.style.overflow = 'hidden';
        }
        function closeModal() {
            modal.classList.remove('open');
            setTimeout(function(){ mFrame.src = ''; }, 300);
            document.body.style.overflow = '';
        }

        items.forEach(function(item) {
            item.addEventListener('click', function() {
                openModal(item.dataset.src, item.dataset.title, item.dataset.desc);
            });
        });

        backdrop.addEventListener('click', closeModal);
        closeBtn.addEventListener('click', closeModal);
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        // Touch: tap same item twice to open modal on mobile
        var lastTapped = null;
        items.forEach(function(item) {
            item.addEventListener('touchend', function(e) {
                if (lastTapped === item) {
                    e.preventDefault();
                    openModal(item.dataset.src, item.dataset.title, item.dataset.desc);
                    lastTapped = null;
                } else {
                    lastTapped = item;
                    setTimeout(function() { lastTapped = null; }, 600);
                }
            }, { passive: false });
        });
    })();
    </script>
</body>
</html>
