<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
    {{ partial "head.html" . }}
    <style>
        /* ===== BASE ===== */
        html {
            height: 100%;
            background: var(--bg-color, #f7f7f5);
        }
        body {
            margin: 0; padding: 0;
            position: fixed; inset: 0;      /* fills full viewport = dark mode works */
            height: 100%;
            overflow: hidden;
            background: var(--bg-color, #f7f7f5);
            color: var(--text-color, #222);
            overscroll-behavior: none;
            transition: background-color 1.2s ease, color 1.2s ease;
        }
        body.dark-mode {
            --bg-color: #11233d;
            --text-color: #fafaf7;
        }
        canvas { display: none; } /* no bg particles on this page */

        /* ===== HEADER — ensure visibility on mobile ===== */
        @media (max-width: 767px) {
            #site-header {
                height: 165px !important;
                overflow: visible !important;
            }
        }

        /* ===== GALLERY CONTAINER — DESKTOP (CSS Grid: always 3 columns) ===== */
        #topo-gallery {
            position: fixed;
            top: clamp(180px, 22vw, 240px);
            left: 0;
            width: 100vw;
            height: calc(100vh - clamp(180px, 22vw, 240px));
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            z-index: 10;
            padding: 40px 5vw 120px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            column-gap: 30px;
            row-gap: 0; /* rows handled by per-item margin */
            align-items: start;
            justify-items: center;
        }
        #topo-gallery::-webkit-scrollbar { display: none; }

        /* ===== BLOB ITEM — DESKTOP ===== */
        .blob-item {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            opacity: 0;
            animation: blobFadeIn 1.1s cubic-bezier(0.2, 0, 0.3, 1) forwards;
        }

        /* Column stagger: col1=0, col2=90px, col3=28px */
        .blob-item:nth-child(3n+1) { margin-top: 0; padding-bottom: 80px; }
        .blob-item:nth-child(3n+2) { margin-top: 90px; padding-bottom: 80px; }
        .blob-item:nth-child(3n+3) { margin-top: 28px; padding-bottom: 80px; }

        /* Circle: 1.5× larger, fits within 3-column grid */
        .blob-circle {
            width: clamp(240px, 28vw, 400px);
            height: clamp(240px, 28vw, 400px);
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            transition: transform 0.45s cubic-bezier(0.2, 0, 0, 1);
        }
        .blob-item:hover .blob-circle { transform: scale(1.04); }

        .blob-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            pointer-events: none;
        }

        /* Soft fog vignette — dissolves into background */
        .blob-fog {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle,
                transparent 34%,
                var(--bg-color, #f7f7f5) 72%
            );
            pointer-events: none;
            z-index: 2;
        }

        .blob-label {
            font-family: "Noto Sans Mono", "SFMono-Regular", monospace;
            font-size: clamp(9px, 0.7vw, 11px);
            letter-spacing: 0.2em;
            color: var(--text-color);
            opacity: 0.5;
            text-align: center;
            max-width: 240px;
            transition: opacity 0.3s;
        }
        .blob-item:hover .blob-label { opacity: 0.88; }

        @keyframes blobFadeIn {
            from { opacity: 0; filter: blur(16px); }
            to   { opacity: 1; filter: blur(0); }
        }

        /* ===== POPUP — simple rounded card ===== */
        #topo-popup {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            position: fixed;
            z-index: 500;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease,
                        visibility 0s linear 0.25s;
            background: var(--bg-color, #f7f7f5);
            border-radius: 20px;
            box-shadow: 0 6px 40px rgba(0,0,0,0.16);
            overflow: hidden;
            width: min(68vw, 600px);
        }
        #topo-popup.open {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
            transition: opacity 0.25s ease, transform 0.25s ease,
                        visibility 0s linear 0s;
        }

        #popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px 10px;
        }
        #popup-title {
            font-family: "Noto Sans Mono", monospace;
            font-size: clamp(11px, 0.95vw, 14px);
            letter-spacing: 0.25em;
            color: var(--text-color);
            opacity: 0.8;
            margin: 0;
        }
        #popup-close {
            background: none;
            border: none;
            font-family: "Noto Sans Mono", monospace;
            font-size: 0.8rem;
            letter-spacing: 0.12em;
            color: var(--text-color);
            opacity: 0.4;
            cursor: pointer;
            padding: 2px 0;
            transition: opacity 0.2s;
            flex-shrink: 0;
        }
        #popup-close:hover { opacity: 0.9; }

        #popup-frame-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
        }
        #popup-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        #popup-desc {
            padding: 12px 20px 18px;
            font-family: "Zen Kaku Gothic New", sans-serif;
            font-size: clamp(10px, 0.78vw, 12px);
            letter-spacing: 0.06em;
            line-height: 1.7;
            color: var(--text-color);
            opacity: 0.52;
            margin: 0;
        }

        /* ===== MOBILE ===== */
        @media (max-width: 767px) {
            /* Gallery: single column, full-screen scroll */
            #topo-gallery {
                top: 0;
                height: 100vh;
                padding: 170px 0 20vh 0; /* below header */
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                flex-wrap: nowrap;
                gap: 28px;
                overflow-x: hidden;
                overflow-y: auto;
                align-content: unset;
            }

            /* Each item: full viewport width */
            .blob-item {
                width: 100vw;
                flex-shrink: 0;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            /* Reset desktop stagger + padding */
            .blob-item:nth-child(3n+1),
            .blob-item:nth-child(3n+2),
            .blob-item:nth-child(3n+3) { margin-top: 0; padding-bottom: 0; }

            /* Large circle: 78vw × 78vw */
            .blob-circle {
                width: 78vw;
                height: 78vw;
                flex-shrink: 0;
            }

            /* ODD: left-biased — circle overflows left edge */
            .blob-item:nth-child(odd) {
                align-items: flex-start;
            }
            .blob-item:nth-child(odd) .blob-circle {
                transform: translateX(-18vw);
            }
            .blob-item:nth-child(odd) .blob-label {
                padding-left: 8vw;
                text-align: left;
            }

            /* EVEN: right-biased — circle overflows right edge */
            .blob-item:nth-child(even) {
                align-items: flex-end;
            }
            .blob-item:nth-child(even) .blob-circle {
                transform: translateX(18vw);
            }
            .blob-item:nth-child(even) .blob-label {
                padding-right: 8vw;
                text-align: right;
            }

            .blob-label {
                font-size: clamp(9px, 2.5vw, 12px);
                max-width: 65vw;
                opacity: 0.6;
            }

            /* Popup: near full width */
            #topo-popup {
                width: 92vw;
            }
        }
    </style>
</head>
<body>
    {{ partial "scripts.html" . }}
    {{ partial "header.html" . }}

    <div id="topo-gallery">
        {{ range $i, $page := .Pages }}
        <div class="blob-item"
             style="animation-delay: {{ mul (float $i) 0.08 }}s"
             data-src="/sketches/{{ $page.Params.sketch }}/"
             data-title="{{ $page.Title }}"
             data-desc="{{ $page.Params.description }}">
            <div class="blob-circle">
                <iframe class="blob-frame"
                        src="/sketches/{{ $page.Params.sketch }}/"
                        loading="lazy"
                        scrolling="no"
                        title="{{ $page.Title }}"></iframe>
                <div class="blob-fog"></div>
            </div>
            <div class="blob-label">{{ $page.Title }}</div>
        </div>
        {{ end }}
    </div>

    <!-- Popup card -->
    <div id="topo-popup">
        <div id="popup-header">
            <h2 id="popup-title"></h2>
            <button id="popup-close">[ close ]</button>
        </div>
        <div id="popup-frame-wrap">
            <iframe id="popup-frame" src="" scrolling="no" title=""></iframe>
        </div>
        <p id="popup-desc"></p>
    </div>

    <script>
    (function() {
        var items    = document.querySelectorAll('.blob-item');
        var popup    = document.getElementById('topo-popup');
        var pFrame   = document.getElementById('popup-frame');
        var pTitle   = document.getElementById('popup-title');
        var pDesc    = document.getElementById('popup-desc');
        var closeBtn = document.getElementById('popup-close');

        function openPopup(src, title, desc) {
            pFrame.src = src;
            pTitle.textContent = title;
            pDesc.textContent  = desc;
            popup.classList.add('open');
        }
        function closePopup() {
            popup.classList.remove('open');
            setTimeout(function() { pFrame.src = ''; }, 300);
        }

        items.forEach(function(item) {
            item.addEventListener('click', function() {
                openPopup(item.dataset.src, item.dataset.title, item.dataset.desc);
            });
        });
        closeBtn.addEventListener('click', closePopup);
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closePopup();
        });

        // Mobile: tap once to preview (iframe activates), tap again to open popup
        var lastTapped = null;
        items.forEach(function(item) {
            item.addEventListener('touchend', function(e) {
                if (lastTapped === item) {
                    e.preventDefault();
                    openPopup(item.dataset.src, item.dataset.title, item.dataset.desc);
                    lastTapped = null;
                } else {
                    lastTapped = item;
                    setTimeout(function() { lastTapped = null; }, 700);
                }
            }, { passive: false });
        });
    })();
    </script>
</body>
</html>
