<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gautama · 三事和合</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0e1218; overflow:hidden; cursor:none; }
#bg { position:fixed;top:0;left:0;z-index:0; }
#fg { position:fixed;top:0;left:0;z-index:1; }
#label {
  position:fixed;top:22px;left:26px;z-index:10;
  font-family:'Georgia',serif;font-size:10px;letter-spacing:.22em;
  color:#8a9aaa;opacity:.28;pointer-events:none;
}
#laws {
  position:fixed;top:22px;right:26px;z-index:10;
  font-family:'Georgia',serif;font-size:8.5px;letter-spacing:.13em;
  color:#8a9aaa;opacity:.16;line-height:2.1;text-align:right;pointer-events:none;
}
#hint {
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:10;
  font-family:'Georgia',serif;font-size:9px;letter-spacing:.20em;
  color:#8a9aaa;opacity:.15;pointer-events:none;
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="fg"></canvas>
<div id="label">gautama · 三事和合</div>
<div id="laws">
  三事和合 · contact-spark<br>
  anicca · impermanence<br>
  anatta · no fixed self<br>
  low friction · laminar<br>
  viscosity · dukkha patch<br>
  vedanā · sensation quality<br>
  縁起 · dependent arising<br>
  outward radiation · karuṇā
</div>
<div id="hint">hover · observe (summons) &nbsp;·&nbsp; click · release viscosity</div>

<script>
// ══════════════════════════════════════════════════════
//  PHYSICS FROM EARLY SUTTAS
// ══════════════════════════════════════════════════════
const G = {
  speed:      0.0014,   // deliberate, slow
  noiseAmp:   0.0018,   // near-laminar (low friction)
  damping:    0.989,    // high — frictionless glide
  lifetime:   [0.22, 0.42], // short — anicca
  maxP:       320,
  contactR:   0.52,     // 三事和合 trigger radius
  spawnRate:  5,        // background spawns per frame attempt
  viscR:      1.1,      // dukkha patch radius (world units)
  viscStr:    0.058,    // stickiness pull strength
  viscLife:   200,      // frames before patch releases
  pulseEvery: 290,      // karuṇā outward radiation interval (frames)
  pulseStr:   0.042,
};

// ── CANVAS ──────────────────────────────────────────────
const bgC = document.getElementById('bg');
const fgC = document.getElementById('fg');
const gl  = bgC.getContext('webgl') || bgC.getContext('experimental-webgl');
const ctx = fgC.getContext('2d');
let W, H;

const FOV   = 520;
const CAM_Z = 5.0;

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  bgC.width=W; bgC.height=H;
  fgC.width=W; fgC.height=H;
  gl.viewport(0,0,W,H);
  if(uRes) gl.uniform2f(uRes,W,H);
  ctx.fillStyle='#0e1218';
  ctx.fillRect(0,0,W,H);
}
window.addEventListener('resize', resize);

// ── BACKGROUND SHADER ────────────────────────────────────
// Dark void with very subtle potential field gradient
// Represents: the emptiness that holds contact-possibility
const VS = `attribute vec2 a_pos; void main(){ gl_Position=vec4(a_pos,0.,1.); }`;
const FS = `
precision highp float;
uniform float u_t;
uniform vec2  u_res;
uniform vec2  u_mouse;
uniform float u_visc; // 0=clear 1=dukkha

float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){
  vec2 i=floor(p),f=fract(p),u=f*f*(3.-2.*f);
  return mix(mix(h(i),h(i+vec2(1,0)),u.x),
             mix(h(i+vec2(0,1)),h(i+vec2(1,1)),u.x),u.y);
}
float fbm(vec2 p,float t){
  float v=0.,a=.5; vec2 q=p;
  // 4 octaves, very slow drift
  q+=vec2(t*.018,0.); v+=a*n(q); q=q*2.+vec2(1.7,9.2); a*=.5;
  q+=vec2(t*.022,0.); v+=a*n(q); q=q*2.+vec2(1.7,9.2); a*=.5;
  q+=vec2(t*.026,0.); v+=a*n(q); q=q*2.+vec2(1.7,9.2); a*=.5;
  q+=vec2(t*.030,0.); v+=a*n(q);
  return v;
}

void main(){
  vec2 uv=gl_FragCoord.xy/u_res;
  vec2 c=uv-.5;
  float t=u_t;

  // deep potential field — very dim, barely visible
  float field = fbm(c*1.4, t*.006);
  // contact probability zones (slightly brighter in certain areas)
  float contact = fbm(c*3.2, t*.012) * fbm(c*1.8+.5, t*.009);

  // gradient magnitude — where tilt is steepest = more potential
  float eps=.018;
  float gx=fbm(c+vec2(eps,0.),t*.012)-fbm(c-vec2(eps,0.),t*.012);
  float gy=fbm(c+vec2(0.,eps),t*.012)-fbm(c-vec2(0.,eps),t*.012);
  float gMag=length(vec2(gx,gy))/(2.*eps);

  // viscosity tint — dukkha patch warms and muddies the void
  float md=length(uv-u_mouse);
  float mouseGlow=smoothstep(.22,.0,md);

  // base: near-void dark blue-grey
  vec3 col=vec3(.055,.068,.088);
  // potential field: very faint brightening
  col+=vec3(.022,.028,.038)*field;
  // contact zones: faint blue-grey lift
  col+=vec3(.008,.012,.020)*contact*1.4;
  // gradient steepness: barely perceptible brightening
  col+=vec3(.006,.009,.014)*gMag*0.8;
  // viscosity: warm muddy tint bleeds in
  col=mix(col, vec3(.085,.062,.048), u_visc*.38);
  // observer glow — very faint warmth near cursor
  col+=vec3(.018,.014,.009)*mouseGlow;
  // grain
  col-=fbm(c*14.+t*.4,0.)*.006;

  gl_FragColor=vec4(clamp(col,.0,1.),1.);
}`;

function mkS(type,src){
  const s=gl.createShader(type);
  gl.shaderSource(s,src); gl.compileShader(s); return s;
}
const prog=gl.createProgram();
gl.attachShader(prog,mkS(gl.VERTEX_SHADER,VS));
gl.attachShader(prog,mkS(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(prog); gl.useProgram(prog);
const buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const aPos=gl.getAttribLocation(prog,'a_pos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,0,0);
const uT    =gl.getUniformLocation(prog,'u_t');
const uRes  =gl.getUniformLocation(prog,'u_res');
const uMouse=gl.getUniformLocation(prog,'u_mouse');
const uVisc =gl.getUniformLocation(prog,'u_visc');

// ── NOISE (JS) ────────────────────────────────────────────
function h2(px,py){return Math.abs(Math.sin(px*127.1+py*311.7)*43758.5453)%1;}
function n2(px,py){
  const ix=Math.floor(px),iy=Math.floor(py),fx=px-ix,fy=py-iy;
  const ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
  const a=h2(ix,iy),b=h2(ix+1,iy),c=h2(ix,iy+1),d=h2(ix+1,iy+1);
  return a+(b-a)*ux+(c-a)*uy+(d-a+a-b-c+b+c-d)*ux*uy;
}
function fbm(px,py,t,o=4){
  let v=0,a=0.5,x=px,y=py;
  for(let i=0;i<o;i++){
    v+=a*n2(x+(i+1)*t*0.025,y); x=x*2+1.7; y=y*2+9.2; a*=0.5;
  }
  return v;
}

// ── PROJECTION ───────────────────────────────────────────
function proj(x,y,z){
  const dz=CAM_Z+z, f=FOV/dz;
  return {sx:W*.5+x*f, sy:H*.5-y*f, f};
}
function s2w(sx,sy){ return {x:(sx-W*.5)/FOV*CAM_Z, y:-(sy-H*.5)/FOV*CAM_Z}; }
function lerp(a,b,t){return a+(b-a)*t;}

// ── PARTICLES ─────────────────────────────────────────────
// vedanā types: 0=neutral(cool-grey), 1=pleasant(warm-gold), 2=unpleasant(dukkha-brown)
const pts = Array.from({length:G.maxP},()=>({
  on:false,x:0,y:0,z:0,vx:0,vy:0,vz:0,
  life:0,age:0,sz:0,
  vedana:0,       // 0/1/2 — sensation quality at birth
  spawnFlash:0,   // 1 at birth → decays (三事和合 flash)
  isContact:false // born from contact-spark (not random field)
}));

function spawnAt(wx,wy,z,vedana=0,isContact=false){
  for(let i=0;i<G.maxP;i++){
    const p=pts[i]; if(p.on) continue;
    p.on=true; p.isContact=isContact;
    p.x=wx+(Math.random()-.5)*(isContact?.08:.35);
    p.y=wy+(Math.random()-.5)*(isContact?.08:.35);
    p.z=z +(Math.random()-.5)*.7;
    p.vx=(Math.random()-.5)*G.speed;
    p.vy=(Math.random()-.5)*G.speed;
    p.vz=(Math.random()-.5)*G.speed*.2;
    p.life=lerp(G.lifetime[0],G.lifetime[1],Math.random());
    p.age=0;
    p.sz=isContact ? (0.5+Math.random()*.7) : (0.6+Math.random()*1.0);
    p.vedana=vedana;
    p.spawnFlash=isContact?1.0:0.0;
    return true;
  }
  return false;
}

// ── VISCOSITY PATCHES (dukkha) ────────────────────────────
// Appear spontaneously, persist for viscLife frames, then release
const viscPatches=[];
let viscGlobal=0; // 0→1 for shader
let frameN=0;
let nextViscFrame = 120+Math.floor(Math.random()*160);

function maybeSpawnVisc(){
  if(frameN<nextViscFrame) return;
  nextViscFrame=frameN+150+Math.floor(Math.random()*200);
  // spawn in random off-center location
  const a=Math.random()*Math.PI*2;
  const r=0.5+Math.random()*1.2;
  viscPatches.push({
    wx:Math.cos(a)*r, wy:Math.sin(a)*r,
    age:0, maxAge:G.viscLife,
    strength:0.5+Math.random()*.5
  });
}

// ── RADIAL PULSE (karuṇā) ─────────────────────────────────
const pulses=[];
let nextPulseFrame=G.pulseEvery;
function maybeSpawnPulse(){
  if(frameN<nextPulseFrame) return;
  nextPulseFrame=frameN+G.pulseEvery+Math.floor(Math.random()*80);
  pulses.push({age:0,maxAge:55});
}

// ── CONTACT SPARKS (三事和合) ─────────────────────────────
// Every N frames, scan for close pairs → birth new particle between them
const CONTACT_STEP=6;
function checkContacts(){
  if(frameN%CONTACT_STEP!==0) return;
  const alive=[];
  for(let i=0;i<G.maxP;i++) if(pts[i].on) alive.push(pts[i]);
  let count=0;
  for(let i=0;i<alive.length&&count<3;i++){
    for(let j=i+1;j<alive.length&&count<3;j++){
      const a=alive[i],b=alive[j];
      const dx=a.x-b.x,dy=a.y-b.y,dz=a.z-b.z;
      const d=Math.sqrt(dx*dx+dy*dy+dz*dz);
      if(d<G.contactR && d>0.08){
        // 三事和合 — born at midpoint, brief vedanā quality
        const vedana=Math.random()<.55?0:Math.random()<.6?1:2;
        const mx=(a.x+b.x)*.5, my=(a.y+b.y)*.5, mz=(a.z+b.z)*.5;
        if(spawnAt(mx,my,mz,vedana,true)) count++;
      }
    }
  }
}

// ── INTERACTION ──────────────────────────────────────────
const mouse={sx:-999,sy:-999,wx:0,wy:0,on:false};
const clickReleases=[]; // click = dukkha release wave

fgC.addEventListener('mousemove',e=>{
  mouse.sx=e.clientX;mouse.sy=e.clientY;mouse.on=true;
  const w=s2w(e.clientX,e.clientY);mouse.wx=w.x;mouse.wy=w.y;
  gl.uniform2f(uMouse,e.clientX/W,1-e.clientY/H);
});
fgC.addEventListener('mouseleave',()=>{mouse.on=false;});
fgC.addEventListener('mousedown',e=>{
  if(e.target!==fgC) return;
  const w=s2w(e.clientX,e.clientY);
  // click releases nearest viscosity patch, or spawns release wave
  clickReleases.push({wx:w.x,wy:w.y,sx:e.clientX,sy:e.clientY,age:0,maxAge:45});
  // dissolve nearby patches
  for(const vp of viscPatches) vp.maxAge=Math.min(vp.maxAge,vp.age+30);
});
fgC.addEventListener('touchmove',e=>{
  e.preventDefault();
  const t=e.touches[0];mouse.sx=t.clientX;mouse.sy=t.clientY;mouse.on=true;
  const w=s2w(t.clientX,t.clientY);mouse.wx=w.x;mouse.wy=w.y;
  gl.uniform2f(uMouse,t.clientX/W,1-t.clientY/H);
},{passive:false});
fgC.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.touches[0];mouse.on=true;
  const w=s2w(t.clientX,t.clientY);
  clickReleases.push({wx:w.x,wy:w.y,sx:t.clientX,sy:t.clientY,age:0,maxAge:45});
  for(const vp of viscPatches) vp.maxAge=Math.min(vp.maxAge,vp.age+30);
},{passive:false});
fgC.addEventListener('touchend',()=>{mouse.on=false;});

// ── UPDATE ────────────────────────────────────────────────
function updatePts(st){
  const dts=0.016;
  for(let i=0;i<G.maxP;i++){
    const p=pts[i]; if(!p.on) continue;
    p.age+=dts*(0.22+Math.random()*.06);
    p.spawnFlash=Math.max(0,p.spawnFlash-0.07);

    // laminar noise field (very gentle — low friction)
    const nx=n2(p.x*0.9+st*0.009, p.y*0.9)-0.5;
    const ny=n2(p.x*0.9, p.y*0.9+st*0.009)-0.5;
    p.vx+=nx*G.noiseAmp;
    p.vy+=ny*G.noiseAmp;
    p.vz+=(Math.random()-.5)*G.noiseAmp*.08;

    // anatta — NO core attractor, pure drift

    // viscosity patches (dukkha = stickiness)
    for(const vp of viscPatches){
      const pr=vp.age/vp.maxAge;
      if(pr>=1) continue;
      const str=vp.strength*(1-pr)*(pr<.5?pr*2:1);
      const dx=vp.wx-p.x,dy=vp.wy-p.y;
      const d=Math.sqrt(dx*dx+dy*dy)+.001;
      if(d<G.viscR){
        // pull INTO patch (stickiness), then release
        const pull=G.viscStr*str*(1-d/G.viscR);
        p.vx+=dx/d*pull; p.vy+=dy/d*pull;
        // also slow down (viscous drag)
        p.vx*=(1-pull*.4); p.vy*=(1-pull*.4);
      }
    }

    // radial pulses (karuṇā — outward radiation)
    for(const pu of pulses){
      const pr2=pu.age/pu.maxAge;
      const dx=p.x,dy=p.y; // from center
      const d=Math.sqrt(dx*dx+dy*dy)+.001;
      const wave=3.5*pr2;
      const diff=Math.abs(d-wave);
      if(diff<.5){ const pw=(1-diff/.5)*(1-pr2)*G.pulseStr; p.vx+=dx/d*pw; p.vy+=dy/d*pw; }
    }

    // click release wave (anti-viscosity burst)
    for(const cr of clickReleases){
      const dx=p.x-cr.wx,dy=p.y-cr.wy;
      const d=Math.sqrt(dx*dx+dy*dy)+.001;
      const pr3=cr.age/cr.maxAge;
      const wave=2.8*pr3;
      const diff=Math.abs(d-wave);
      if(diff<.4){ const pw=(1-diff/.4)*(1-pr3)*.055; p.vx+=dx/d*pw; p.vy+=dy/d*pw; }
    }

    // hover: observer summons (very gentle — AF_0001 style)
    if(mouse.on){
      const dx=mouse.wx-p.x,dy=mouse.wy-p.y;
      const d=Math.sqrt(dx*dx+dy*dy)+.001;
      const wr=220/FOV*CAM_Z;
      if(d<wr){ const s=(1-d/wr)*(1-d/wr)*.018; p.vx+=dx/d*s; p.vy+=dy/d*s; }
    }

    // anicca boundary: soft — don't bounce, just dampen and let drift
    p.vx*=G.damping; p.vy*=G.damping; p.vz*=G.damping;
    p.x+=p.vx; p.y+=p.vy; p.z+=p.vz;

    if(Math.abs(p.x)>4.2) p.vx*=-.3;
    if(Math.abs(p.y)>3.2) p.vy*=-.3;
    if(p.z>1.4)  p.vz-=.002;
    if(p.z<-3.5) p.vz+=.002;

    if(p.age>p.life) p.on=false;
  }
}

// ── DRAW ──────────────────────────────────────────────────
function vedanaColor(v,z,flash){
  // vedanā 0=neutral, 1=pleasant, 2=unpleasant
  // depth tint: far=dim grey, near=richer
  const t=(z+3.5)/5; // 0=far, 1=near
  if(flash>0){
    // birth flash: warm gold regardless of vedanā
    const a=flash*.9;
    return {r:lerp(150,220,flash),g:lerp(140,200,flash),b:lerp(120,160,flash),a};
  }
  const depth=lerp(0.22,0.72,t);
  if(v===0) return {r:lerp(40,72,t), g:lerp(52,88,t),  b:lerp(68,108,t), a:depth};  // neutral cool
  if(v===1) return {r:lerp(55,90,t), g:lerp(70,105,t), b:lerp(62,88,t),  a:depth};  // pleasant warmer
              return {r:lerp(50,82,t), g:lerp(44,68,t),  b:lerp(40,62,t), a:depth};  // unpleasant dukkha
}

function drawScene(){
  // trail — long latency but dark base
  ctx.fillStyle='rgba(14,18,24,0.055)';
  ctx.fillRect(0,0,W,H);

  // viscosity patches — faint warm haze
  for(const vp of viscPatches){
    const pr=vp.age/vp.maxAge; if(pr>=1) continue;
    const str=vp.strength*(1-pr)*(pr<.5?pr*2:1);
    const pv=proj(vp.wx,vp.wy,0);
    const r=G.viscR/CAM_Z*FOV*1.1;
    const grd=ctx.createRadialGradient(pv.sx,pv.sy,0,pv.sx,pv.sy,r);
    grd.addColorStop(0,`rgba(90,62,48,${str*.12})`);
    grd.addColorStop(1,'rgba(90,62,48,0)');
    ctx.beginPath();ctx.arc(pv.sx,pv.sy,r,0,Math.PI*2);
    ctx.fillStyle=grd;ctx.fill();
  }

  // radial pulse rings (karuṇā)
  for(const pu of pulses){
    const pr=pu.age/pu.maxAge;
    const r=pr*(W*.48);
    ctx.beginPath();ctx.arc(W*.5,H*.5,r,0,Math.PI*2);
    ctx.strokeStyle=`rgba(88,110,132,${(1-pr)*.10})`;
    ctx.lineWidth=2*(1-pr);ctx.stroke();
  }

  // click release waves
  for(const cr of clickReleases){
    const pr=cr.age/cr.maxAge;
    const r=pr*W*.35;
    ctx.beginPath();ctx.arc(cr.sx,cr.sy,r,0,Math.PI*2);
    ctx.strokeStyle=`rgba(120,145,165,${(1-pr)*.13})`;
    ctx.lineWidth=1.5*(1-pr);ctx.stroke();
  }

  // interference lines (縁起 — dependent arising)
  const alive=[];
  for(let i=0;i<G.maxP;i++) if(pts[i].on) alive.push(pts[i]);
  alive.sort((a,b)=>a.z-b.z);

  const step=4;
  for(let i=0;i<alive.length;i+=step){
    const a=alive[i];const pa=proj(a.x,a.y,a.z);
    for(let j=i+step;j<alive.length;j+=step){
      const b=alive[j];
      const dx=a.x-b.x,dy=a.y-b.y,dz=a.z-b.z;
      const d=Math.sqrt(dx*dx+dy*dy+dz*dz);
      const thresh=0.95;
      if(d<thresh){
        const pb=proj(b.x,b.y,b.z);
        // lines very faint — "invisible threads of dependent arising"
        const alpha=0.048*(1-d/thresh);
        const zAvg=(a.z+b.z)*.5;
        const tl=(zAvg+3.5)/5;
        const rr=Math.round(lerp(30,62,tl));
        const gg=Math.round(lerp(40,78,tl));
        const bb=Math.round(lerp(55,95,tl));
        ctx.beginPath();ctx.moveTo(pa.sx,pa.sy);ctx.lineTo(pb.sx,pb.sy);
        ctx.strokeStyle=`rgba(${rr},${gg},${bb},${alpha})`;
        ctx.lineWidth=0.45;ctx.stroke();
      }
    }
  }

  // particles
  for(const p of alive){
    const fade=p.age<.04?p.age/.04:p.age>p.life-.08?(p.life-p.age)/.08:1;
    const pr=proj(p.x,p.y,p.z);
    const vc=vedanaColor(p.vedana,p.z,p.spawnFlash);
    const sz=Math.max(.3, p.sz * pr.f * 0.016);
    const alpha=fade*vc.a*(p.isContact?1.0:.72);

    if(p.spawnFlash>0.01){
      // contact-born flash: sharp bright point
      const grd=ctx.createRadialGradient(pr.sx,pr.sy,0,pr.sx,pr.sy,sz*2.2);
      grd.addColorStop(0,`rgba(${vc.r},${vc.g},${vc.b},${alpha*1.2})`);
      grd.addColorStop(.4,`rgba(${vc.r},${vc.g},${vc.b},${alpha*.5})`);
      grd.addColorStop(1,'rgba(0,0,0,0)');
      ctx.beginPath();ctx.arc(pr.sx,pr.sy,sz*2.2,0,Math.PI*2);
      ctx.fillStyle=grd;ctx.fill();
    } else {
      const grd=ctx.createRadialGradient(pr.sx,pr.sy,0,pr.sx,pr.sy,sz);
      grd.addColorStop(0,`rgba(${vc.r},${vc.g},${vc.b},${alpha})`);
      grd.addColorStop(.6,`rgba(${vc.r},${vc.g},${vc.b},${alpha*.45})`);
      grd.addColorStop(1,'rgba(0,0,0,0)');
      ctx.beginPath();ctx.arc(pr.sx,pr.sy,sz,0,Math.PI*2);
      ctx.fillStyle=grd;ctx.fill();
    }
  }

  // cursor
  if(mouse.on){
    ctx.beginPath();ctx.arc(mouse.sx,mouse.sy,7,0,Math.PI*2);
    ctx.strokeStyle='rgba(140,160,180,0.22)';ctx.lineWidth=0.8;ctx.stroke();
    ctx.beginPath();ctx.arc(mouse.sx,mouse.sy,1.2,0,Math.PI*2);
    ctx.fillStyle='rgba(140,160,180,0.35)';ctx.fill();
  }
}

// ── FIELD SPAWN ───────────────────────────────────────────
function trySpawn(st){
  let alive=0;
  for(let i=0;i<G.maxP;i++) if(pts[i].on) alive++;
  if(alive>=G.maxP) return;
  // random drift spawn across field (no zones — anatta)
  const wx=(Math.random()-.5)*5.5;
  const wy=(Math.random()-.5)*3.8;
  const z=-3.0+Math.random()*3.8;
  // only spawn where potential field has some value
  const f=fbm(wx*.8,wy*.8,st*.006);
  if(f>.38 || Math.random()<.008) spawnAt(wx,wy,z,0,false);
  // hover summons
  if(mouse.on && Math.random()<.12) spawnAt(mouse.wx,mouse.wy,(Math.random()-.5)*2.8,0,false);
}

// ── MAIN LOOP ─────────────────────────────────────────────
let st=0,lastT=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min(ts-lastT,32);lastT=ts;st+=dt*.001;
  frameN++;

  // age/prune viscosity patches
  viscGlobal=0;
  for(let i=viscPatches.length-1;i>=0;i--){
    viscPatches[i].age++;
    if(viscPatches[i].age>=viscPatches[i].maxAge){viscPatches.splice(i,1);continue;}
    viscGlobal=Math.max(viscGlobal, viscPatches[i].strength*(1-viscPatches[i].age/viscPatches[i].maxAge));
  }
  for(let i=clickReleases.length-1;i>=0;i--){
    clickReleases[i].age++;
    if(clickReleases[i].age>=clickReleases[i].maxAge) clickReleases.splice(i,1);
  }
  for(let i=pulses.length-1;i>=0;i--){
    pulses[i].age++;
    if(pulses[i].age>=pulses[i].maxAge) pulses.splice(i,1);
  }

  maybeSpawnVisc();
  maybeSpawnPulse();
  checkContacts();

  for(let i=0;i<G.spawnRate;i++) trySpawn(st);
  updatePts(st);

  // bg
  gl.uniform1f(uT,st);
  gl.uniform1f(uVisc,viscGlobal);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);

  drawScene();
}

// ── INIT ──────────────────────────────────────────────────
resize();
gl.uniform2f(uRes,W,H);
gl.uniform2f(uMouse,.5,.5);
gl.uniform1f(uVisc,0);
requestAnimationFrame(loop);
</script>
