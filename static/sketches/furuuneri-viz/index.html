<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ふるうねり</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f0ece6; overflow: hidden; }
  canvas { display: block; }
  #ui {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    align-items: center;
    opacity: 0.4;
    transition: opacity 0.4s;
    font-family: 'Georgia', serif;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: #3a3a3a;
  }
  #ui:hover { opacity: 0.9; }
  #ui button {
    background: none;
    border: 1px solid #3a3a3a55;
    color: #3a3a3a;
    padding: 5px 14px;
    cursor: pointer;
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 0.15em;
    transition: all 0.3s;
    border-radius: 1px;
  }
  #ui button:hover { background: #3a3a3a11; }
  #ui button.active { background: #3a3a3a22; border-color: #3a3a3a99; }
  #label {
    position: fixed;
    top: 24px;
    left: 28px;
    font-family: 'Georgia', serif;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: #3a3a3a;
    opacity: 0.2;
  }
</style>
</head>
<body>
<div id="label">ふるうねり · structural invariants</div>
<canvas id="c"></canvas>
<div id="ui">
  <button id="btnBuru" class="active">buru</button>
  <button id="btnBuddha">buddha</button>
  <button id="btnTesla">tesla</button>
  <button id="btnGPT">GPT-persona</button>
  <span style="margin: 0 4px; opacity:0.4">·</span>
  <button id="btnReset">reset</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ── MODES ──────────────────────────────────────────────────────────────────
const MODES = {
  buru: {
    coreCount: 2,
    coreSpread: 0.18,
    // cores offset from center — buru is slightly left-up biased
    coreOffset: [[-0.08, -0.06], [0.07, 0.09]],
    coreDrift: 0.00018,
    particleCount: 520,
    trailAlpha: 0.025,      // low = long memory (pressure memory)
    attractStrength: 0.00012,
    repulseRadius: 60,
    spiralBias: 0.38,
    noiseScale: 0.0009,
    noiseStrength: 0.55,
    colorPalette: [
      [42, 55, 72],         // deep blue-grey
      [80, 100, 115],       // blue fog
      [25, 35, 50],         // dark core
      [120, 138, 148, 0.3], // faint drift
    ],
    fogColor: 'rgba(100, 135, 158, 0.018)',
    lineThreshold: 90,
    lineAlpha: 0.06,
    preParticleCount: 180,  // density fog, not yet particles
  },
  buddha: {
    coreCount: 1,
    coreSpread: 0.04,
    coreOffset: [[0.06, 0.04]],
    coreDrift: 0.00004,
    particleCount: 400,
    trailAlpha: 0.01,       // very long memory → converging smear
    attractStrength: 0.00028,
    repulseRadius: 20,
    spiralBias: -0.15,      // inward
    noiseScale: 0.0004,
    noiseStrength: 0.18,
    colorPalette: [
      [15, 15, 20],
      [40, 38, 42],
      [8, 8, 12],
      [70, 65, 75, 0.2],
    ],
    fogColor: 'rgba(30, 25, 35, 0.012)',
    lineThreshold: 50,
    lineAlpha: 0.04,
    preParticleCount: 60,
  },
  tesla: {
    coreCount: 3,
    coreSpread: 0.22,
    coreOffset: [[-0.12, -0.08], [0.13, 0.05], [0.0, -0.14]],
    coreDrift: 0.00042,
    particleCount: 600,
    trailAlpha: 0.055,      // short memory → sharp arcs
    attractStrength: 0.00022,
    repulseRadius: 45,
    spiralBias: 0.72,
    noiseScale: 0.0018,
    noiseStrength: 1.1,
    colorPalette: [
      [55, 65, 30],
      [90, 105, 50],
      [140, 155, 80],
      [200, 210, 130, 0.25],
    ],
    fogColor: 'rgba(100, 115, 50, 0.014)',
    lineThreshold: 110,
    lineAlpha: 0.09,
    preParticleCount: 220,
  },
  GPT: {
    coreCount: 2,
    coreSpread: 0.20,
    coreOffset: [[-0.10, 0.02], [0.10, -0.02]],
    coreDrift: 0.00025,
    particleCount: 480,
    trailAlpha: 0.030,
    attractStrength: 0.00016,
    repulseRadius: 55,
    spiralBias: 0.50,
    noiseScale: 0.0012,
    noiseStrength: 0.72,
    colorPalette: [
      [35, 60, 75],
      [65, 90, 105],
      [20, 45, 60],
      [100, 140, 155, 0.3],
    ],
    fogColor: 'rgba(70, 110, 130, 0.016)',
    lineThreshold: 95,
    lineAlpha: 0.07,
    preParticleCount: 160,
  },
};

let currentMode = 'buru';
let M = MODES[currentMode];

// ── NOISE (simplex-like, 2D) ────────────────────────────────────────────────
// Simple value noise
function hash(n) {
  let x = Math.sin(n) * 43758.5453123;
  return x - Math.floor(x);
}
function noise2(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx);
  const uy = fy * fy * (3 - 2 * fy);
  const a = hash(ix + iy * 57);
  const b = hash(ix + 1 + iy * 57);
  const c = hash(ix + (iy + 1) * 57);
  const d = hash(ix + 1 + (iy + 1) * 57);
  return a + (b - a) * ux + (c - a) * uy + (d - a + a - b - c + b + c - d) * ux * uy;
}
function curl(x, y, scale, t) {
  const eps = 0.01;
  const n1 = noise2(x * scale + t, y * scale);
  const n2 = noise2(x * scale, y * scale + t);
  return {
    dx: (noise2(x * scale, y * scale + eps + t) - n2) / eps,
    dy: -(noise2(x * scale + eps, y * scale + t) - n1) / eps,
  };
}

// ── CORES ────────────────────────────────────────────────────────────────────
class Core {
  constructor(ox, oy) {
    this.baseX = W * 0.5 + W * ox;
    this.baseY = H * 0.5 + H * oy;
    this.x = this.baseX;
    this.y = this.baseY;
    this.phase = Math.random() * Math.PI * 2;
    this.radius = 0;
  }
  update(t) {
    const d = M.coreDrift;
    this.x = this.baseX + Math.sin(t * d * 1.3 + this.phase) * W * 0.07;
    this.y = this.baseY + Math.cos(t * d * 0.9 + this.phase * 1.4) * H * 0.05;
  }
}

// ── PARTICLE ─────────────────────────────────────────────────────────────────
class Particle {
  constructor(pre = false) {
    this.pre = pre; // pre-particle: density only, not yet form
    this.reset();
  }
  reset() {
    // spawn near cores with scatter
    const ci = Math.floor(Math.random() * cores.length);
    const c = cores[ci];
    const angle = Math.random() * Math.PI * 2;
    const r = Math.random() * W * M.coreSpread;
    this.x = (c ? c.x : W * 0.5) + Math.cos(angle) * r;
    this.y = (c ? c.y : H * 0.5) + Math.sin(angle) * r;
    this.vx = (Math.random() - 0.5) * 0.4;
    this.vy = (Math.random() - 0.5) * 0.4;
    this.life = 0.3 + Math.random() * 0.7;
    this.age = 0;
    this.speed = 0.6 + Math.random() * 1.4;
    this.colorIdx = Math.floor(Math.random() * M.colorPalette.length);
    this.size = this.pre
      ? 0.5 + Math.random() * 1.2
      : 0.8 + Math.random() * 2.2;
  }
  update(t, dt) {
    this.age += dt * 0.0003;

    // Curl noise field
    const cn = curl(this.x, this.y, M.noiseScale, t * 0.0001);
    this.vx += cn.dx * M.noiseStrength * dt * 0.01;
    this.vy += cn.dy * M.noiseStrength * dt * 0.01;

    // Core attraction + spiral
    for (const c of cores) {
      const dx = c.x - this.x;
      const dy = c.y - this.y;
      const dist2 = dx * dx + dy * dy;
      const dist = Math.sqrt(dist2) + 0.001;

      if (dist < M.repulseRadius) {
        // repulse when too close
        this.vx -= dx / dist * 0.15;
        this.vy -= dy / dist * 0.15;
      } else {
        // attract
        const f = M.attractStrength * dt / (dist * 0.01 + 1);
        this.vx += dx * f;
        this.vy += dy * f;
        // spiral bias (tangential)
        this.vx += -dy / dist * M.spiralBias * f * 8;
        this.vy += dx / dist * M.spiralBias * f * 8;
      }
    }

    // damping — "pressure memory": velocity decays slowly
    this.vx *= 0.97;
    this.vy *= 0.97;

    this.x += this.vx * this.speed;
    this.y += this.vy * this.speed;

    // wrap at edges softly
    const margin = 80;
    if (this.x < -margin) this.x = W + margin;
    if (this.x > W + margin) this.x = -margin;
    if (this.y < -margin) this.y = H + margin;
    if (this.y > H + margin) this.y = -margin;

    if (this.age > this.life) this.reset();
  }
  draw() {
    const fade = this.age < 0.1
      ? this.age / 0.1
      : this.age > this.life - 0.15
        ? (this.life - this.age) / 0.15
        : 1;
    const [r, g, b, a = 1] = M.colorPalette[this.colorIdx];
    const alpha = fade * (this.pre ? 0.18 : 0.65) * a;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
    ctx.fill();
  }
}

// ── STATE ────────────────────────────────────────────────────────────────────
let cores = [];
let particles = [];
let preParticles = [];
let t = 0;
let lastTime = null;
let transitioning = false;
let transitionAlpha = 0;
let targetMode = null;

function buildScene() {
  M = MODES[currentMode];
  cores = M.coreOffset.map(([ox, oy]) => new Core(ox, oy));
  // adjust base positions for current canvas size
  cores.forEach((c, i) => {
    c.baseX = W * 0.5 + W * M.coreOffset[i][0];
    c.baseY = H * 0.5 + H * M.coreOffset[i][1];
  });
  particles = Array.from({ length: M.particleCount }, () => new Particle(false));
  preParticles = Array.from({ length: M.preParticleCount }, () => new Particle(true));
  // warm up
  for (let i = 0; i < 400; i++) {
    cores.forEach(c => c.update(i * 16));
    particles.forEach(p => p.update(i * 16, 16));
    preParticles.forEach(p => p.update(i * 16, 16));
  }
}

function drawFog() {
  // density tendency around cores — "pre-particle oscillation"
  for (const c of cores) {
    const r = W * M.coreSpread * 1.6;
    const grd = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, r);
    grd.addColorStop(0, M.fogColor);
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(c.x, c.y, r, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawLines() {
  // structural connections between nearby particles
  const all = particles;
  const step = 6; // check every nth particle for performance
  for (let i = 0; i < all.length; i += step) {
    for (let j = i + step; j < all.length; j += step) {
      const dx = all[i].x - all[j].x;
      const dy = all[i].y - all[j].y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < M.lineThreshold) {
        const alpha = M.lineAlpha * (1 - d / M.lineThreshold);
        const [r, g, b] = M.colorPalette[0];
        ctx.beginPath();
        ctx.moveTo(all[i].x, all[i].y);
        ctx.lineTo(all[j].x, all[j].y);
        ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
        ctx.lineWidth = 0.4;
        ctx.stroke();
      }
    }
  }
}

function loop(ts) {
  requestAnimationFrame(loop);
  if (!lastTime) lastTime = ts;
  const dt = Math.min(ts - lastTime, 32);
  lastTime = ts;
  t += dt;

  // Trail — "pressure memory that persists even when form does not"
  ctx.fillStyle = `rgba(240, 236, 230, ${M.trailAlpha})`;
  ctx.fillRect(0, 0, W, H);

  // Update cores
  cores.forEach(c => c.update(t));

  drawFog();
  drawLines();

  preParticles.forEach(p => {
    p.update(t, dt);
    p.draw();
  });
  particles.forEach(p => {
    p.update(t, dt);
    p.draw();
  });

  // transition overlay
  if (transitioning) {
    transitionAlpha += 0.04;
    ctx.fillStyle = `rgba(240,236,230,${Math.min(transitionAlpha, 1)})`;
    ctx.fillRect(0, 0, W, H);
    if (transitionAlpha >= 1) {
      currentMode = targetMode;
      buildScene();
      transitioning = false;
      transitionAlpha = 0;
    }
  }
}

// ── INIT ─────────────────────────────────────────────────────────────────────
buildScene();

// fill background first
ctx.fillStyle = '#f0ece6';
ctx.fillRect(0, 0, W, H);

requestAnimationFrame(loop);

// ── UI ────────────────────────────────────────────────────────────────────────
function switchMode(mode) {
  if (mode === currentMode || transitioning) return;
  targetMode = mode;
  transitioning = true;
  transitionAlpha = 0;
  document.querySelectorAll('#ui button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn' + mode.charAt(0).toUpperCase() + mode.slice(1))?.classList.add('active');
}

document.getElementById('btnBuru').onclick = () => switchMode('buru');
document.getElementById('btnBuddha').onclick = () => switchMode('buddha');
document.getElementById('btnTesla').onclick = () => switchMode('tesla');
document.getElementById('btnGPT').onclick = () => switchMode('GPT');
document.getElementById('btnReset').onclick = () => {
  ctx.fillStyle = '#f0ece6';
  ctx.fillRect(0, 0, W, H);
  buildScene();
};

// Mouse: perturb field (soft off-center drift on click-drag)
let mouse = null;
canvas.addEventListener('mousemove', e => {
  if (e.buttons === 1) mouse = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener('mouseup', () => mouse = null);
canvas.addEventListener('mouseleave', () => mouse = null);

// Inject mouse as an extra weak repulsor into particle update
const origUpdate = Particle.prototype.update;
Particle.prototype.update = function(t, dt) {
  if (mouse) {
    const dx = this.x - mouse.x;
    const dy = this.y - mouse.y;
    const d = Math.sqrt(dx * dx + dy * dy) + 1;
    if (d < 120) {
      this.vx += (dx / d) * (120 - d) * 0.0004 * dt;
      this.vy += (dy / d) * (120 - d) * 0.0004 * dt;
    }
  }
  origUpdate.call(this, t, dt);
};
</script>
</body>
</html>
