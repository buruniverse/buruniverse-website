<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buruniverse</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #F4F2F0;
      --text:   #1a1917;
      --dim:    rgba(26, 25, 23, 0.35);
      --accent: #3a5da8;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', 'Noto Sans Mono', 'MS Gothic', monospace;
      overflow: hidden;
    }

    /* ── Loading screen ─────────────────────────────── */
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      overflow: hidden;
      z-index: 100;
      background: var(--bg);
      transition: opacity 0.9s ease;
    }
    #loader.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    #kaomoji {
      font-size: clamp(13px, 3.5vw, 21px);
      white-space: pre;
      letter-spacing: 0;
      position: absolute;
      left: 0;
      opacity: 1;
      transition: opacity 0.08s ease;
    }
    #kaomoji.flash {
      opacity: 0.25;
    }
    /* centered phase: spring snap into center */
    #kaomoji.is-centered {
      left: 50% !important;
      transform: translateX(-50%);
      transition: left 0.28s cubic-bezier(0.34, 1.4, 0.64, 1),
                  transform 0.28s cubic-bezier(0.34, 1.4, 0.64, 1),
                  opacity 0.08s ease;
    }

    /* ── Main page ───────────────────────────────────── */
    #main {
      position: fixed;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease 0.25s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.6rem;
      padding: 2rem;
    }
    #main.visible {
      opacity: 1;
      pointer-events: all;
    }

    /* chat box */
    .chat-wrap {
      width: min(92%, 480px);
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .chat-label {
      font-size: clamp(15px, 3.8vw, 20px);
      text-align: center;
      letter-spacing: 0.03em;
    }
    .chat-input {
      background: rgba(26,25,23,0.04);
      border: 1px solid var(--dim);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      color: var(--text);
      font-family: inherit;
      font-size: clamp(13px, 3.2vw, 16px);
      width: 100%;
      outline: none;
      transition: border-color 0.25s;
    }
    .chat-input::placeholder { color: var(--dim); }
    .chat-input:focus { border-color: var(--accent); }

    /* menu toggle */
    .menu-toggle {
      font-size: clamp(12px, 2.8vw, 15px);
      color: var(--dim);
      cursor: pointer;
      letter-spacing: 0.08em;
      user-select: none;
      transition: color 0.2s;
    }
    .menu-toggle:hover { color: var(--text); }

    /* slide-down menu */
    .menu-drawer {
      width: min(92%, 480px);
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity 0.35s ease;
      opacity: 0;
    }
    .menu-drawer.open {
      max-height: 400px;
      opacity: 1;
    }
    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      padding: 0.6rem 0 0.2rem;
      list-style: none;
      font-size: clamp(13px, 3vw, 16px);
    }
    .menu-list a {
      color: var(--dim);
      text-decoration: none;
      letter-spacing: 0.06em;
      transition: color 0.2s;
    }
    .menu-list a:hover { color: var(--text); }

    /* footer line */
    .footer-line {
      position: fixed;
      bottom: 1.2rem;
      font-size: clamp(10px, 2.2vw, 12px);
      color: rgba(26,25,23,0.2);
      letter-spacing: 0.12em;
    }
  </style>
</head>
<body>

<!-- ── Loading screen ──────────────────────────────────── -->
<div id="loader">
  <div id="kaomoji">|</div>
</div>

<!-- ── Main page ───────────────────────────────────────── -->
<div id="main">
  <div class="chat-wrap">
    <div class="chat-label">(*･ω･*) おしゃべりする？💬</div>
    <input class="chat-input" type="text" placeholder="なにか聞いてみて…">
  </div>

  <div class="menu-toggle" id="menu-toggle">▼ﾋﾗｸ</div>

  <div class="menu-drawer" id="menu-drawer">
    <ul class="menu-list">
      <li><a href="/prototypes">≐ Prototypes φ(-ω-。`)</a></li>
      <li><a href="/games">∞ Games ¶(´ω´)₉</a></li>
      <li><a href="/posts">Σ Books of thoughts (˜ω˜)ₒoO</a></li>
      <li><a href="/experiments">μ Experiments ~(=^·ω·^)</a></li>
      <li><a href="/about">About Me..</a></li>
    </ul>
  </div>

  <div class="footer-line">2026 Buruniverse · EN / JA</div>
</div>

<script>
  // ── Animation frames ─────────────────────────────────────
  // Timings doubled + intermediate frames added for smoothness
  const frames = [

    // ── peek from left edge ───────────────────────────────
    { text: '|',                                              centered: false, ms: 720 },
    { text: '|·',                                            centered: false, ms: 380 },
    { text: ' | )',                                           centered: false, ms: 600 },
    { text: ' |･ )',                                          centered: false, ms: 380 },
    { text: ' |ω･ )…',                                       centered: false, ms: 900 },

    // ── wave hello ────────────────────────────────────────
    { text: ' |ω･ )ﾉ',                                       centered: false, ms: 440 },
    { text: ' |ω･ )ﾉｼ𓈒𓏸 ｺﾝﾆﾁﾊ',                            centered: false, ms: 1520 },
    { text: ' |ω･ )ﾉ',                                       centered: false, ms: 340 },
    { text: ' |ω･ )…',                                       centered: false, ms: 500 },
    { text: ' |ω･ )',                                         centered: false, ms: 380 },

    // ── get ready to run ──────────────────────────────────
    { text: ' | ω･)っ…ｯｽ',                                   centered: false, ms: 720 },
    { text: ' |っ･ω･)っ…',                                   centered: false, ms: 340 },
    { text: ' |( っ･ω･)っ…ｽｽｯ',                              centered: false, ms: 440 },

    // ── dash ──────────────────────────────────────────────
    { text: '|-=≡((っ･ω･)っﾀﾞｯ',                                                                        centered: false, ms: 220 },
    { text: '|-=≡((((((((っ･ω･)っ',                                                                     centered: false, ms: 180 },
    { text: '|-=≡(((((((((((((((((っ･ω･)っﾋﾞｭｩｩｩｩｰｰｰ',                                                 centered: false, ms: 180 },
    { text: '    　  　=≡((((((((((((((((((((((((((っ･ω･)っｰｰｰｰｰｩｩｩｩｰｰｰｰｰ',                            centered: false, ms: 180 },
    { text: '             　　   　 ≡(((((((((((((((((((((((((((((((((((((((っ･ω･)っｰｰｰｰｰｰｰｰｰｰｰｰﾝ',     centered: false, ms: 300 },
    { text: '　　　　　　　　　　　　　　　　　　　　　　　　　　　　　-=≡⊂(･`ω･´⊂)))))ｷｷｷｷｰｰ!!',    centered: false, ms: 480 },

    // ── land center ───────────────────────────────────────
    { text: '( ･ω･ )…ｽｯ…',                                                                             centered: true,  ms: 900 },
    { text: '⊂( ･ω･ )⊃ …ｼｬｯ…!',                                                                       centered: true,  ms: 1400 },

    // ── tada! ─────────────────────────────────────────────
    { text: '　　‧₊˚⋅\\└( ･ω･ )┘///‧₊˚⋅',                                                              centered: true,  ms: 700 },
    { text: 'ﾖｳｺｿ ‧₊˚⋅\\└( ･ω･ )┘///‧₊˚⋅',                                                            centered: true,  ms: 700 },
    { text: 'ﾖｳｺｿ ‧₊˚⋅\\└( ･ω･ )┘///‧₊˚⋅ｲﾗｯｼｬｲ!!',                                                   centered: true,  ms: 1100 },

    // ── loading wait (API or model loading goes here) ─────
    { text: 'ｼﾞｭﾝﾋﾞｽﾙﾖ~ (。-ω-).｡…',                        centered: true,  ms: 2200 },
    { text: 'ﾁｮｯﾄﾏｯﾃﾅ~ (。-ω-).｡o …',                       centered: true,  ms: 2200 },
    { text: 'ﾓｳｽｸﾞﾖ~ (。-ω-).｡oO …',                        centered: true,  ms: 2200 },
    { text: '…(。•ω•) ﾊｯ!',                                  centered: true,  ms: 1300 },
    { text: '(*･∀･*)✧ ｵﾏﾀｾ~',                               centered: true,  ms: 1800 },
  ];

  const loader   = document.getElementById('loader');
  const kaomoji  = document.getElementById('kaomoji');
  const main     = document.getElementById('main');

  let idx = 0;

  function tick() {
    if (idx >= frames.length) {
      loader.classList.add('fade-out');
      setTimeout(() => {
        loader.style.display = 'none';
        main.classList.add('visible');
      }, 950);
      return;
    }

    const f = frames[idx++];

    // subtle flash on frame change for ぬるぬる feel
    kaomoji.classList.add('flash');
    setTimeout(() => {
      kaomoji.textContent = f.text;
      kaomoji.classList.remove('flash');

      if (f.centered) {
        kaomoji.classList.add('is-centered');
      } else {
        kaomoji.classList.remove('is-centered');
        kaomoji.style.transform = '';
      }
    }, 80);

    setTimeout(tick, f.ms);
  }

  setTimeout(tick, 100);

  // ── ▼ﾋﾗｸ / ▲ﾄｼﾞﾙ toggle ──────────────────────────────
  const toggle = document.getElementById('menu-toggle');
  const drawer = document.getElementById('menu-drawer');
  let   open   = false;

  toggle.addEventListener('click', () => {
    open = !open;
    drawer.classList.toggle('open', open);
    toggle.textContent = open ? '▲ﾄｼﾞﾙ' : '▼ﾋﾗｸ';
  });
</script>

</body>
</html>
