<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buruniverse</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #F4F2F0;
      --text:   #1a1917;
      --dim:    rgba(26, 25, 23, 0.35);
      --accent: #3a5da8;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans Mono', monospace;
      overflow: hidden;
    }

    /* ── Loading screen ─────────────────────────────── */
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      overflow: hidden;
      z-index: 100;
      background: var(--bg);
      transition: opacity 0.9s ease;
    }
    #loader.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    #kaomoji {
      font-size: clamp(18px, 3.5vw, 21px);
      white-space: pre;
      letter-spacing: 0;
      position: absolute;
      left: 0;
      opacity: 1;
      transition: opacity 0.08s ease;
    }
    #kaomoji.flash {
      opacity: 0.25;
    }
    /* shake animation */
    @keyframes kaomoji-shake {
      0%,100% { margin-left: 0; }
      20%     { margin-left: -6px; }
      40%     { margin-left:  6px; }
      60%     { margin-left: -5px; }
      80%     { margin-left:  5px; }
    }
    #kaomoji.is-shaking {
      animation: kaomoji-shake 0.1s linear infinite;
    }

    /* ── Logo (top center, always visible) ──────────── */
    #logo {
      position: fixed;
      top: 1.6rem;
      left: 50%;
      transform: translateX(-50%);
      width: 66vw;             /* スマホ: 画面の66% */
      pointer-events: none;
      z-index: 200;
    }
    @media (min-width: 768px) {
      #logo { width: 20vw; }   /* PC: 画面の20% */
    }

    /* centered phase: spring snap into center */
    #kaomoji.is-centered {
      left: 50% !important;
      transform: translateX(-50%);
      transition: left 0.28s cubic-bezier(0.34, 1.4, 0.64, 1),
                  transform 0.28s cubic-bezier(0.34, 1.4, 0.64, 1),
                  opacity 0.08s ease;
    }

    /* ── Main page ───────────────────────────────────── */
    #main {
      position: fixed;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease 0.25s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.6rem;
      padding: 2rem;
    }
    #main.visible {
      opacity: 1;
      pointer-events: all;
    }

    /* chat box */
    .chat-wrap {
      width: min(92%, 480px);
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .chat-label {
      font-size: clamp(16px, 3.8vw, 20px);
      text-align: center;
      letter-spacing: 0.03em;
      opacity: 0;                    /* hidden until kaomoji arrives */
      transition: opacity 0.25s ease;
    }
    .chat-input {
      background: rgba(26,25,23,0.04);
      border: 1px solid var(--dim);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      color: var(--text);
      font-family: inherit;
      font-size: clamp(16px, 3.2vw, 16px);
      width: 100%;
      outline: none;
      transition: border-color 0.25s;
    }
    .chat-input::placeholder { color: var(--dim); }
    .chat-input:focus { border-color: var(--accent); }

    /* menu toggle */
    .menu-toggle {
      font-size: clamp(16px, 2.8vw, 16px);
      color: var(--dim);
      cursor: pointer;
      letter-spacing: 0.08em;
      user-select: none;
      transition: color 0.2s;
    }
    .menu-toggle:hover { color: var(--text); }

    /* slide-down menu */
    .menu-drawer {
      width: min(92%, 480px);
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity 0.35s ease;
      opacity: 0;
    }
    .menu-drawer.open {
      max-height: 60vh;
      overflow-y: auto;
      opacity: 1;
    }

    /* メインメニュー */
    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      padding: 0.8rem 0 0.6rem;
      list-style: none;
      font-size: clamp(16px, 3vw, 16px);
    }
    .menu-list li {
      position: relative;
      padding-left: 1.4em;
    }
    .menu-list li::before {
      content: '▶︎';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.7em;
      opacity: 0;
      transition: opacity 0.15s;
      color: var(--text);
      pointer-events: none;
    }
    /* デスクトップ: ホバーで表示 */
    @media (hover: hover) {
      .menu-list li:hover::before { opacity: 1; }
    }
    /* スマホ: JS が .active を付与 */
    .menu-list li.active::before { opacity: 1; }

    .menu-list a {
      color: var(--text);
      text-decoration: none;
      letter-spacing: 0.06em;
      transition: color 0.2s;
    }
    .menu-list a:hover { opacity: 0.6; }

    /* SNSアイコン行 */
    .menu-sns {
      display: flex;
      gap: 0.8rem;
      padding: 0.8rem 0 0.6rem 1.4em;
    }
    .sns-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid var(--dim);
      display: inline-block;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .sns-dot:hover { border-color: var(--text); }

    /* コーヒー・コンタクト */
    .menu-extras {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      padding: 0.4rem 0 0.8rem 1.4em;
      font-size: clamp(16px, 3vw, 16px);
    }
    .menu-extras a, .menu-extras div {
      color: var(--text);
      text-decoration: none;
      letter-spacing: 0.04em;
    }
    .menu-extras a:hover { opacity: 0.6; }

    /* Privacy Policy以下: 薄く小さく */
    .menu-legal {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      padding: 0.6rem 0 1rem 1.4em;
      font-size: 14px;
      color: var(--dim);
      border-top: 1px solid rgba(26,25,23,0.1);
    }
    .menu-legal a {
      color: var(--dim);
      text-decoration: none;
      transition: color 0.2s;
    }
    .menu-legal a:hover { color: var(--text); }

    /* footer line */
    .footer-line {
      position: fixed;
      bottom: 1.2rem;
      font-size: clamp(10px, 2.2vw, 12px);
      color: rgba(26,25,23,0.2);
      letter-spacing: 0.12em;
    }
  </style>
</head>
<body>

<!-- ── Logo (top center, always visible) ──────────────────── -->
<img id="logo" src="/images/logo_new.PNG" alt="Buruniverse">

<!-- ── Loading screen ──────────────────────────────────── -->
<div id="loader">
  <div id="kaomoji">|</div>
</div>

<!-- ── Main page ───────────────────────────────────────── -->
<div id="main">
  <div class="chat-wrap">
    <div class="chat-label">(*･ω･*)&lt; おしゃべりする？💬</div>
    <input class="chat-input" type="text" placeholder="なにか聞いてみて…">
  </div>

  <div class="menu-toggle" id="menu-toggle">▼ﾒﾆｭｰﾋﾗｸ</div>

  <div class="menu-drawer" id="menu-drawer">
    <ul class="menu-list">
      <li><a href="/about">Ψ＿サイトについて</a></li>
      <li><a href="/topology">✧＿意識トポロジー</a></li>
      <li><a href="/books">Ω＿ブログ本棚</a></li>
      <li><a href="/stretch">࿐＿ストレッチ&amp;倒立スペース</a></li>
      <li><a href="/games">∞＿ミニゲーム</a></li>
      <li><a href="/experiments">μ＿実験のカケラ</a></li>
    </ul>

    <div class="menu-sns">
      <span class="sns-dot"></span>
      <span class="sns-dot"></span>
      <span class="sns-dot"></span>
      <span class="sns-dot"></span>
      <span class="sns-dot"></span>
    </div>

    <div class="menu-extras">
      <a href="/coffee">→ サイト主にコーヒーを奢る ₍₍ (ง ˘ω˘ )ว ⁾⁾☕️</a>
      <div>Contact - dummy@mail.com</div>
    </div>

    <div class="menu-legal">
      <a href="/privacy">Privacy Policy</a>
      <a href="/legal">特定商取引法について</a>
    </div>
  </div>

  <div class="footer-line">©︎2026 ∴ Buruniverse ∵ </div>
</div>

<script>
  // ── Screen-relative positioning helper ───────────────────
  // 画面幅の fraction (0.0〜1.0) の位置にテキストの先頭を置く
  // フォントサイズを clamp(13px, 3.5vw, 21px) で近似して算出
  const _fs = Math.min(21, Math.max(18, window.innerWidth * 0.035));
  const _cw = _fs * 0.55; // 半角1文字あたりの幅 (px)
  function atX(text, frac) {
    const n = Math.max(0, Math.round((window.innerWidth * frac) / _cw));
    return ' '.repeat(n) + text;
  }

  // ── Animation frames ─────────────────────────────────────
  const frames = [

    // ── peek from left edge ───────────────────────────────
    { text: ' |',                                              centered: false, ms: 720 },
    { text: ' | )',                                           centered: false, ms: 600 },
    { text: ' |ω･)…',                                       centered: false, ms: 900 },

    // ── get ready to run ──────────────────────────────────
    { text: ' | ω･)っ…ｯｽ',                                   centered: false, ms: 700 },
    { text: ' |(っ･ω･)っ…ｽｽｯ',                              centered: false, ms: 850 },

    // ── dash (atX で画面幅に対する相対位置を指定) ────────────
    { text: ' |-=≡((っ･ω･)っ',                                    centered: false, ms: 720 },
    { text: atX('-=≡((((((((っ･ω･)っﾋﾞｭｩｩｩｰｰｰ',      0.18),          centered: false, ms: 600 },
    { text: atX('=≡(((((((((((((((((((っ･ω･)っｰｰｰｰｩｩｰｰｰｰｰﾝ', 0.38),          centered: false, ms: 850 },
    { text: atX('    　ｲｷｽｷﾞﾀ┗(･ω･ ;)┓=3=3=3',          0.35),          centered: false, ms: 1400 },

    // ── land center ───────────────────────────────────────　
    { text: '⊂( ･ω･ )⊃',                                                                       centered: true,  ms: 1400, noSpring: true },

    // ── tada! ─────────────────────────────────────────────
    { text: '     ‧₊˚⋅\\\\\\└( ･ω･ )┘///‧₊˚⋅       ',                                                centered: true,  ms: 900 },
    { text: '‧₊˚⋅\\\\\\ﾖｳｺｿ!└( ･ω･ )┘ｲﾗｯｼｬｲ!///‧₊˚⋅',                                                centered: true,  ms: 1800 },

    // ── loading wait (API or model loading goes here) ─────
    { text: 'ｼﾞｭﾝﾋﾞｽﾙﾖ~ (。-ω-).｡…',                        centered: true,  ms: 1800 },
    { text: 'ﾁｮｯﾄﾏｯﾃﾅ~ (。-ω-).｡o …',                       centered: true,  ms: 1800 },
    { text: 'ﾓｳｽｸﾞﾖ~ (。-ω-).｡oO …',                        centered: true,  ms: 1800 },
    { text: '…(。•ω•) ﾊｯ!',                                  centered: true,  ms: 1300 },
    { text: '(*･∀･*)✧ ｵﾏﾀｾ~',                               centered: true,  ms: 1800 },

    // ── typewriter ────────────────────────────────────────
    { text: '(*･ω･*)',                                        centered: true,  ms: 0,
      typewriter: '< おしゃべりする？💬', typeSpeed: 75 },
  ];

  const loader   = document.getElementById('loader');
  const kaomoji  = document.getElementById('kaomoji');
  const main     = document.getElementById('main');

  let idx = 0;

  function tick() {
    if (idx >= frames.length) {
      loader.classList.add('fade-out');
      setTimeout(() => {
        loader.style.display = 'none';
        main.classList.add('visible');
      }, 950);
      return;
    }

    const f = frames[idx++];

    // subtle flash on frame change for ぬるぬる feel
    kaomoji.classList.add('flash');
    setTimeout(() => {
      kaomoji.textContent = f.text;
      kaomoji.classList.remove('flash');

      if (f.centered) {
        // noSpring: override the spring easing with a flat ease
        kaomoji.style.transition = f.noSpring
          ? 'opacity 0.08s ease'
          : '';
        kaomoji.classList.add('is-centered');
      } else {
        kaomoji.style.transition = '';
        kaomoji.classList.remove('is-centered');
        kaomoji.style.transform = '';
      }

      // shake on/off
      kaomoji.classList.toggle('is-shaking', !!f.shake);

      // typewriter mode
      if (f.typewriter) {
        const append = f.typewriter;
        const spd    = f.typeSpeed || 80;
        const base   = f.text;
        let   i      = 0;
        setTimeout(function step() {
          kaomoji.textContent = base + append.slice(0, ++i);
          if (i < append.length) {
            setTimeout(step, spd);
          } else {
            // last frame → move to final position instead of fading
            const next = idx >= frames.length ? moveToFinalPosition : tick;
            setTimeout(next, 700);
          }
        }, 350); // brief pause before typing starts
        return;
      }
    }, 80);

    // typewriter frames schedule themselves — skip outer timer
    if (!f.typewriter) {
      setTimeout(tick, f.ms);
    }
  }

  // ── Final position animation ──────────────────────────
  function moveToFinalPosition() {
    const chatLabel = document.querySelector('.chat-label');
    const labelRect = chatLabel.getBoundingClientRect();
    const kaoRect   = kaomoji.getBoundingClientRect();

    // center-to-center vertical distance
    const deltaY = (labelRect.top + labelRect.height / 2)
                 - (kaoRect.top   + kaoRect.height  / 2);

    // animate kaomoji to chat-label position
    kaomoji.style.transition = 'transform 0.7s cubic-bezier(0.4, 0, 0.2, 1)';
    kaomoji.style.transform  = `translateX(-50%) translateY(${deltaY}px)`;

    // after movement: instant swap (no fade)
    setTimeout(() => {
      // make everything ready (behind the loader)
      main.style.transition      = 'none';
      main.style.opacity         = '1';
      main.style.pointerEvents   = 'all';
      chatLabel.style.transition = 'none';
      chatLabel.style.opacity    = '1';

      // then hide loader — all of #main appears at once
      setTimeout(() => {
        loader.style.display = 'none';
      }, 40);
    }, 750);
  }

  setTimeout(tick, 100);

  // ── ▼ﾒﾆｭｰﾋﾗｸ / ▲ﾄｼﾞﾙ toggle ──────────────────────────────
  const toggle = document.getElementById('menu-toggle');
  const drawer = document.getElementById('menu-drawer');
  let   open   = false;

  toggle.addEventListener('click', () => {
    open = !open;
    drawer.classList.toggle('open', open);
    toggle.textContent = open ? '▲ﾄｼﾞﾙ' : '▼ﾒﾆｭｰﾋﾗｸ';
    if (open) updateActiveItem();
  });

  // ── スマホ: スクロールで▶︎を追従 ─────────────────────────
  const menuItems = drawer.querySelectorAll('.menu-list li');

  function updateActiveItem() {
    // hover が使えるデバイス (PC) はCSSに任せる
    if (window.matchMedia('(hover: hover)').matches) return;

    const drawerRect = drawer.getBoundingClientRect();
    const refY = drawerRect.top + 48; // ドロワー上端から少し下を基準に

    let closest = null;
    let minDist = Infinity;
    menuItems.forEach(item => {
      const rect = item.getBoundingClientRect();
      const dist = Math.abs(rect.top - refY);
      if (dist < minDist) { minDist = dist; closest = item; }
    });

    menuItems.forEach(i => i.classList.remove('active'));
    if (closest) closest.classList.add('active');
  }

  drawer.addEventListener('scroll', updateActiveItem);
</script>

</body>
</html>
